services:
  - type: web
    name: xoptime
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: SELLER_API_URL
        sync: false
      - key: SELLER_SYNC_KEY
        sync: false
